[project]
name = "photodoctor"
version = "0.5.16"
description = "Локальная диагностика и безопасное улучшение фотографий для Windows"
authors = [{ name = "Привалов Олег" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11.3,<13",
  "pillow-heif>=1.7,<2",
  "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
gui = ["PySide6>=6.8,<7"]
ai = ["onnxruntime>=1.20,<2"]
ai-cpu = ["onnxruntime>=1.20,<2"]
ai-cuda = ["onnxruntime-gpu>=1.20,<2"]
ai-directml = ["onnxruntime-directml>=1.20,<2"]
ai-openvino = ["onnxruntime-openvino>=1.20,<2"]
almaz-build = ["torch", "timm>=1.0,<2", "onnx>=1.16,<2"]
build = ["pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"photodoctor.ai" = ["models/*.npz", "models/*.txt"]
"photodoctor" = ["assets/*.png", "assets/*.ico"]
